<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ilustração do produto">
  <defs>
    <radialGradient id="fundo" cx="50%" cy="38%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="{% if ilustracao == 'cupcake' %}#f6e4da{% else %}#dcebf5{% endif %}"/></radialGradient>
    <radialGradient id="cobertura" cx="38%" cy="28%" r="80%"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".35" stop-color="{{ cor }}" stop-opacity="1"/><stop offset="1" stop-color="#000000" stop-opacity=".28"/></radialGradient>
    <linearGradient id="forminha" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".3" stop-color="#fff" stop-opacity=".25"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
    <linearGradient id="volume" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".35" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#fundo)"/>
  <ellipse cx="100" cy="178" rx="52" ry="7" fill="#000" opacity=".07"/>
{% if ilustracao == 'lata' %}
  <rect x="64" y="38" width="72" height="136" rx="10" fill="{{ cor }}"/>
  <rect x="68" y="30" width="64" height="14" rx="6" fill="#c9ced3"/>
  <rect x="68" y="168" width="64" height="10" rx="5" fill="#c9ced3"/>
  <path d="M64 92 Q100 76 136 92 L136 116 Q100 100 64 116 Z" fill="#ffffff" opacity=".9"/>
  <rect x="74" y="46" width="8" height="116" rx="4" fill="#ffffff" opacity=".22"/>
  <circle cx="100" cy="140" r="9" fill="#ffffff" opacity=".85"/>
  <rect x="64" y="38" width="72" height="136" rx="10" fill="url(#volume)"/>
{% elif ilustracao == 'garrafa' %}
  <rect x="88" y="22" width="24" height="12" rx="3" fill="#2b6cb0"/>
  <path d="M90 34 h20 v14 q22 12 22 40 v78 q0 10 -10 10 h-44 q-10 0 -10 -10 v-78 q0 -28 22 -40 z" fill="{{ cor }}" opacity=".55"/>
  <path d="M90 34 h20 v14 q22 12 22 40 v78 q0 10 -10 10 h-44 q-10 0 -10 -10 v-78 q0 -28 22 -40 z" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <rect x="70" y="104" width="60" height="34" rx="4" fill="#ffffff" opacity=".95"/>
  <path d="M84 121 q8 -10 16 0 q8 10 16 0" stroke="#2b6cb0" stroke-width="3" fill="none"/>
  <rect x="78" y="70" width="6" height="88" rx="3" fill="#ffffff" opacity=".45"/>
  <path d="M90 34 h20 v14 q22 12 22 40 v78 q0 10 -10 10 h-44 q-10 0 -10 -10 v-78 q0 -28 22 -40 z" fill="url(#volume)" opacity=".6"/>
{% else %}
  <path d="M52 112 L148 112 L136 172 Q100 180 64 172 Z" fill="{% if enfeite == 'ervas' %}#d9a066{% else %}#e8b4c8{% endif %}"/>
  <g stroke="#ffffff" stroke-opacity=".55" stroke-width="3">
    <line x1="68" y1="114" x2="74" y2="172"/><line x1="84" y1="114" x2="87" y2="175"/>
    <line x1="100" y1="114" x2="100" y2="176"/><line x1="116" y1="114" x2="113" y2="175"/>
    <line x1="132" y1="114" x2="126" y2="172"/>
  </g>
  <path d="M52 112 L148 112 L136 172 Q100 180 64 172 Z" fill="url(#forminha)"/>
  {% if enfeite == 'ervas' %}
  <path d="M46 114 Q48 76 100 70 Q152 76 154 114 Z" fill="{{ cor }}"/>
  <path d="M46 114 Q48 76 100 70 Q152 76 154 114 Z" fill="url(#cobertura)"/>
  <circle cx="80" cy="94" r="5" fill="#6a994e"/><circle cx="116" cy="88" r="4" fill="#6a994e"/><circle cx="128" cy="102" r="5" fill="#bc4749"/>
  <path d="M96 66 q10 -18 22 -14 q-6 14 -22 14z" fill="#6a994e"/>
  {% else %}
  <ellipse cx="100" cy="106" rx="56" ry="16" fill="{{ cor }}"/>
  <ellipse cx="100" cy="106" rx="56" ry="16" fill="url(#cobertura)"/>
  <ellipse cx="100" cy="88" rx="46" ry="17" fill="{{ cor }}"/>
  <ellipse cx="100" cy="88" rx="46" ry="17" fill="url(#cobertura)"/>
  <ellipse cx="100" cy="71" rx="33" ry="15" fill="{{ cor }}"/>
  <ellipse cx="100" cy="71" rx="33" ry="15" fill="url(#cobertura)"/>
  <path d="M100 42 Q120 52 110 62 Q100 66 92 60 Q86 52 100 42Z" fill="{{ cor }}"/>
  <path d="M100 42 Q120 52 110 62 Q100 66 92 60 Q86 52 100 42Z" fill="url(#cobertura)"/>
  <path d="M66 84 Q80 76 96 79" stroke="#ffffff" stroke-opacity=".55" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M74 101 Q90 95 108 97" stroke="#ffffff" stroke-opacity=".4" stroke-width="4" fill="none" stroke-linecap="round"/>
    {% if enfeite == 'cereja' %}
  <circle cx="102" cy="34" r="11" fill="#c1121f"/><path d="M102 24 Q108 10 118 8" stroke="#4a2c2a" stroke-width="3" fill="none"/>
  <circle cx="98" cy="31" r="3" fill="#fff" opacity=".6"/>
    {% elif enfeite == 'morango' %}
  <path d="M90 52 Q104 22 118 52 Q104 66 90 52Z" fill="#e63946"/>
  <path d="M96 30 l8 6 8 -6 -4 8 h-8z" fill="#2d6a4f"/>
  <g fill="#ffe8a3"><circle cx="99" cy="46" r="1.6"/><circle cx="108" cy="44" r="1.6"/><circle cx="104" cy="54" r="1.6"/></g>
    {% elif enfeite == 'chocolate' %}
  <rect x="90" y="30" width="30" height="20" rx="3" fill="#3d2314" transform="rotate(-18 105 40)"/>
  <g stroke="#3d2314" stroke-width="4" stroke-linecap="round"><line x1="70" y1="84" x2="74" y2="78"/><line x1="128" y1="80" x2="132" y2="86"/><line x1="96" y1="72" x2="100" y2="66"/><line x1="140" y1="98" x2="146" y2="96"/></g>
    {% elif enfeite == 'limao' %}
  <circle cx="104" cy="44" r="15" fill="#f9e04b" stroke="#d4b106" stroke-width="3"/>
  <g stroke="#d4b106" stroke-width="2"><line x1="104" y1="31" x2="104" y2="57"/><line x1="91" y1="44" x2="117" y2="44"/><line x1="95" y1="35" x2="113" y2="53"/><line x1="113" y1="35" x2="95" y2="53"/></g>
    {% elif enfeite == 'acai' %}
  <g fill="#3c1053"><circle cx="96" cy="48" r="7"/><circle cx="110" cy="44" r="7"/><circle cx="104" cy="56" r="7"/><circle cx="118" cy="54" r="6"/><circle cx="88" cy="58" r="6"/></g>
  <g fill="#c9a26b"><rect x="66" y="88" width="9" height="6" rx="2" transform="rotate(20 70 91)"/><rect x="128" y="84" width="9" height="6" rx="2"/><rect x="104" y="76" width="8" height="5" rx="2" transform="rotate(-25 108 78)"/><rect x="142" y="102" width="8" height="5" rx="2"/></g>
  <circle cx="93" cy="45" r="2" fill="#fff" opacity=".5"/>
    {% elif enfeite == 'cupuacu' %}
  <ellipse cx="104" cy="46" rx="20" ry="14" fill="#7a4a24"/>
  <path d="M84 46 a20 14 0 0 1 40 0 z" fill="#f4e3b5"/>
  <g fill="#7a4a24" opacity=".35"><circle cx="96" cy="40" r="2"/><circle cx="106" cy="38" r="2"/><circle cx="114" cy="42" r="2"/></g>
  <path d="M120 34 q12 -10 22 -4 q-10 10 -22 4z" fill="#3a7d44"/>
    {% elif enfeite == 'coco' %}
  <path d="M86 52 a18 18 0 0 1 36 0 z" fill="#5c3b1e"/>
  <path d="M90 52 a14 14 0 0 1 28 0 z" fill="#ffffff"/>
  <g fill="#ffffff" stroke="#e8dccb" stroke-width="1"><rect x="64" y="86" width="10" height="3" rx="1.5" transform="rotate(25 69 87)"/><rect x="126" y="82" width="10" height="3" rx="1.5" transform="rotate(-20 131 83)"/><rect x="98" y="74" width="10" height="3" rx="1.5"/><rect x="138" y="100" width="9" height="3" rx="1.5" transform="rotate(30 142 101)"/><rect x="76" y="104" width="9" height="3" rx="1.5" transform="rotate(-15 80 105)"/></g>
    {% endif %}
  {% endif %}
{% endif %}
</svg>
